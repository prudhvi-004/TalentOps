<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TalentOps Sandbox Sign In</title>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body class="login-body">
  <div class="login-screen"><form class="login-card" id="loginForm">
    <div class="login-logo"><div class="logo-icon">T</div><span class="logo-text">TalentOps</span></div>
    <h1 class="login-title">Sandbox sign in</h1>
    <p class="login-sub">Development sandbox access</p>
    <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required/></div>
    <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required/></div>
    <p class="login-sub" id="loginError" role="alert" style="display:none;color:#b42318"></p>
    <button class="btn btn-primary btn-full" type="submit" id="submitBtn">Sign In</button>
  </form></div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('submitBtn');
      const error = document.getElementById('loginError');
      error.style.display = 'none';
      button.disabled = true;
      try {
        const response = await fetch('/auth/login', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            returnTo: new URLSearchParams(location.search).get('returnTo'),
          }),
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.error || 'Sign in failed.');
        location.assign(result.redirect || '/');
      } catch (e) {
        error.textContent = e.message || 'Could not sign in.';
        error.style.display = '';
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
