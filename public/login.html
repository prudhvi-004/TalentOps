<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    LOGIN PAGE — login.html
    ========================
    Purpose:
      Single presenter login screen for executive demo.
      Submits to POST /login on the Express server.
      On success: server creates session, redirects to /
      On failure: redirects back with ?error=1 in URL

    Credentials are set in .env:
      DEMO_USERNAME=demo
      DEMO_PASSWORD=talentops2024

    For production:
      Replace form POST with SSO/SAML redirect button.
      The Express route (server/routes/auth.routes.js)
      handles the actual credential validation.
  -->
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TalentOps — Login</title>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body class="login-body">

  <div class="login-screen">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-icon">T</div>
        <span class="logo-text">TalentOps</span>
      </div>

      <h1 class="login-title">Welcome Back</h1>
      <p class="login-sub">Recruitment Operations Platform — Demo</p>

      <!-- Error message shown when ?error=1 is in URL -->
      <div class="login-error" id="loginError">
        Incorrect username or password. Please try again.
      </div>

      <!-- Login form — posts to Express /login route -->
      <form method="POST" action="/login" class="login-form">

        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          Sign In →
        </button>

      </form>

      <p class="login-footer">
        Demo credentials: <strong>demo</strong> / <strong>talentops2024</strong>
      </p>

    </div>
  </div>

  <script>
    // Show error message if URL contains ?error=1
    // This flag is set by the server on failed login attempt
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === '1') {
      document.getElementById('loginError').style.display = 'block';
    }
  </script>

</body>
</html>
